name: Weekly database backup

# Supabase free has no automatic backups. This dumps the clinic's data every week, encrypts it, and keeps it as a
# workflow artifact for 8 weeks. THIS REPOSITORY IS PUBLIC: the dump is encrypted with BACKUP_PASSPHRASE before it is
# uploaded, and the plain file never leaves the runner. Setup and restore steps: docs/SETUP.md, "Backups".

on:
  schedule:
    - cron: '30 22 * * 0'   # Sunday 22:30 UTC = Monday 04:00 IST, well outside clinic hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the secrets are set
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$URL" ] || { echo "::error::Add the BACKUP_DATABASE_URL secret (Supabase session pooler, port 5432). See docs/SETUP.md, Backups."; exit 1; }
          [ "${#PASS}" -ge 20 ] || { echo "::error::BACKUP_PASSPHRASE must be at least 20 characters. See docs/SETUP.md, Backups."; exit 1; }

      - name: Dump the arx schema
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PG_VERSION: ${{ vars.PG_CLIENT_VERSION || '17' }}   # must be at least the Supabase Postgres version
        run: |
          docker run --rm -e BACKUP_DATABASE_URL "postgres:${PG_VERSION}" \
            sh -c 'pg_dump "$BACKUP_DATABASE_URL" --schema=arx --format=custom --no-owner --no-privileges' > arx.dump
          test "$(stat -c %s arx.dump)" -gt 10000 || { echo "::error::The dump is suspiciously small. Check the connection string."; exit 1; }

      - name: Check the dump can be read
        env:
          PG_VERSION: ${{ vars.PG_CLIENT_VERSION || '17' }}
        run: |
          docker run --rm -v "$PWD:/b:ro" "postgres:${PG_VERSION}" pg_restore --list /b/arx.dump > toc.txt
          grep -q "TABLE arx patients" toc.txt || { echo "::error::The dump does not contain arx.patients."; exit 1; }
          echo "Tables in the dump: $(grep -c ' TABLE arx ' toc.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt (AES-256) and remove the plain file
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          STAMP="$(date -u +%Y-%m-%d)"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
            --output "arx-${STAMP}.dump.gpg" arx.dump 3<<<"$PASS"
          shred -u arx.dump toc.txt
          echo "Encrypted backup: arx-${STAMP}.dump.gpg ($(stat -c %s "arx-${STAMP}.dump.gpg") bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep it for 8 weeks
        uses: actions/upload-artifact@v4
        with:
          name: arx-backup
          path: arx-*.dump.gpg
          retention-days: 56
          if-no-files-found: error
